name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install peer dependencies
        run: npm install --no-save --ignore-scripts @deepseek-ai/cordis@4.1.0 @deepseek-ai/dsh-credentials@0.2.2-rc.1 @deepseek-ai/dsh-mcp-client@0.2.2-rc.1 @deepseek-ai/schemastery@3.19.0
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- lib/client.js
      - run: npm pack --dry-run
