name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# npm trusted publishing (OIDC).
# - `id-token: write` lets the runner request the short-lived OIDC token that
#   npm exchanges for a publish token; it is the only permission trusted
#   publishing needs and it is why no npm token is configured anywhere.
# - `contents: write` stays for creating the GitHub Release and uploading the
#   packed tarball.
permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install peer dependencies
        run: npm install --no-save --ignore-scripts @deepseek-ai/cordis@4.1.0 @deepseek-ai/dsh-credentials@0.2.2-rc.1 @deepseek-ai/dsh-mcp-client@0.2.2-rc.1 @deepseek-ai/schemastery@3.19.0
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
      - name: Run the test suite
        # Every test file is portable now: the launch plan no longer depends on
        # a path on this machine.
        run: node --test test/*.test.js
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- lib/client.js
      - name: Pack the installable tarball
        run: npm pack
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v$VERSION"
          FLAGS=()
          case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; esac
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "dsh-alibaba-mcp $RELEASE_TAG" \
              --generate-notes \
              "${FLAGS[@]}"
          gh release upload "$RELEASE_TAG" "dsh-alibaba-mcp-$VERSION.tgz" --clobber
      - name: Publish to npm
        # Trusted publishing (OIDC): the npm CLI picks up the OIDC token that
        # GitHub mints for this workflow and exchanges it for a publish token.
        # No npm token is stored in the repository.
        #
        # Prerequisite (register once per package on npmjs.com,
        # Packages -> dsh-alibaba-mcp -> Settings -> Trusted publishing):
        #   Organization or user: NingYuanLee
        #   Repository:           dsh-alibaba-mcp
        #   Workflow filename:    publish.yml   (file name only, matching
        #                         .github/workflows/publish.yml exactly, case
        #                         included)
        #   Environment name:     leave empty
        #
        # The same relationship can be registered from the command line
        # (npm 11.16 or newer, after `npm login`):
        #   npm trust github dsh-alibaba-mcp --file publish.yml \
        #     --repo NingYuanLee/dsh-alibaba-mcp --allow-publish
        run: npm publish
